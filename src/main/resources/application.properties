spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/ecotask
spring.datasource.username=postgres
spring.datasource.password=1234

spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

api.security.token.secret=${JWT_SECRET:my-secret-key}

# Configuração de Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m,expireAfterAccess=5m
# Log de cache (pode remover em produção)
# logging.level.org.springframework.cache=DEBUG

# Configuração de Internacionalização (i18n)
spring.web.locale=pt_BR
spring.web.locale-resolver=accept_header

# Integração com modelo local via Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2

# Configurações do chat ambiental
app.ai.system-prompt=Você é uma assistente especializada em tarefas e atitudes que ajudam o meio ambiente. Responda sempre em português brasileiro, com dicas práticas, encorajando ações sustentáveis.
app.ai.allowed-keywords=reciclagem,reciclar,economia de agua,economia de energia,energia,agua,plantio,plantar,arvore,sustentabilidade,natureza,meio ambiente,ecologia,compostagem,lixo,residuos,plastico,carbono,emissoes,reflorestamento
app.ai.minimum-keyword-matches=1
app.ai.out-of-scope-message=Desculpe — só posso ajudar com tarefas que ajudam a natureza.